<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1C1E"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF453A"/>
      <stop offset="50%" stop-color="#FF9F0A"/>
      <stop offset="100%" stop-color="#FFD60A"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#30D158"/>
    </linearGradient>
  </defs>
  
  <!-- Background with iOS squircle radius -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  
  <!-- Subtle border -->
  <rect width="508" height="508" x="2" y="2" rx="113" fill="none" stroke="#2C2C2E" stroke-width="4"/>
  
  <!-- Outer Energy Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#2C2C2E" stroke-width="24" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#ring)" stroke-width="24" stroke-linecap="round" stroke-dasharray="1068" stroke-dashoffset="320" transform="rotate(-90 256 256)"/>
  
  <!-- Flame Icon in Center -->
  <path d="M256 120 C256 120, 200 200, 200 260 C200 295, 225 330, 256 340 C287 330, 312 295, 312 260 C312 220, 280 180, 280 180 C280 180, 290 220, 275 240 C265 220, 270 190, 256 120 Z" fill="url(#flame)" />
</svg>
